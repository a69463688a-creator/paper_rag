<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperRAG 论文阅读助手</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-bg: #eff6ff;
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: .2s ease;
        }

        body.dark-mode {
            --primary: #60a5fa;
            --primary-light: #93bbfd;
            --primary-bg: #1e293b;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --hover: #1e293b;
            --shadow: 0 1px 3px rgba(0,0,0,.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg-secondary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        header h1 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        header h1 i { color: var(--primary); font-size: 1rem; }
        .theme-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 1rem;
            cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .theme-btn:hover { background: var(--hover); color: var(--text); }

        /* Layout */
        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            flex-shrink: 0;
        }
        .sidebar .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar .btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: .85rem;
            transition: var(--transition);
        }
        .sidebar .btn:hover { background: var(--primary-bg); border-color: var(--primary); }
        .sidebar .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .sidebar .btn.primary:hover { background: var(--primary-light); }
        .sidebar .divider {
            color: var(--text-secondary);
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-top: 4px;
        }
        .sidebar .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar .history-item {
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: .8rem;
            color: var(--text-secondary);
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .history-item:hover { background: var(--hover); color: var(--text); }
        .sidebar .session-id {
            font-size: .7rem;
            color: var(--text-secondary);
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Messages */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeIn .25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; }
        .message.system { align-self: flex-start; }
        .message .label {
            font-size: .75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .message .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.65;
            font-size: .92rem;
            word-break: break-word;
        }
        .message.user .bubble {
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.system .bubble {
            background: var(--bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message .bubble pre {
            background: rgba(0,0,0,.06);
            padding: 12px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 8px 0;
            font-size: .83rem;
        }
        .message .bubble code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: .83rem; }
        .message .bubble p { margin: 4px 0; }
        .message .bubble img { max-width: 100%; border-radius: var(--radius-sm); }

        /* Source citations */
        .sources-box {
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--primary-bg);
            border-radius: var(--radius-sm);
            font-size: .78rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .sources-box .sources-title {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: .72rem;
        }
        .sources-box .source-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 0;
        }
        .sources-box .source-item .source-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: .67rem;
            background: var(--primary);
            color: #fff;
            white-space: nowrap;
        }
        .sources-box .source-item .source-badge.figure { background: #8b5cf6; }
        .sources-box .source-item .source-badge.table { background: #059669; }

        /* Typing */
        .typing { display: flex; gap: 4px; padding: 12px 16px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input */
        .chat-input-bar {
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 14px 24px 16px;
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: .76rem;
            color: var(--text-secondary);
        }
        .filter-row select {
            padding: 3px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-size: .76rem;
        }
        .input-row { display: flex; gap: 8px; }
        .input-row textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: .84rem;
            resize: none;
            height: 40px;
            max-height: 110px;
            font-family: inherit;
            background: var(--bg-secondary);
            color: var(--text);
            transition: var(--transition);
        }
        .input-row textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }
        .input-row .send-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: .84rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .input-row .send-btn:hover { background: var(--primary-light); }
        .input-row .send-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }

        /* Quick replies */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .quick-replies .chip {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: .74rem;
            color: var(--text-secondary);
            cursor: pointer;
            background: var(--bg);
            transition: var(--transition);
        }
        .quick-replies .chip:hover {
            background: var(--primary-bg);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-book-open"></i> PaperRAG 论文阅读助手</h1>
        <button class="theme-btn" id="themeToggle" title="切换主题">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="actions">
                <button class="btn primary" id="newSessionBtn">
                    <i class="fas fa-plus"></i> 新会话
                </button>
                <button class="btn" id="clearHistoryBtn">
                    <i class="fas fa-trash-alt"></i> 清除历史
                </button>
            </div>
            <span class="divider">历史会话</span>
            <div class="history-list" id="historyList"></div>
            <div class="session-id" id="sessionInfo"></div>
        </aside>

        <!-- 聊天区域 -->
        <main class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message system">
                    <span class="label">论文阅读助手</span>
                    <div class="bubble">您好！我是论文阅读助手，可以帮您检索和分析学术论文。请问有什么想了解的？</div>
                </div>
            </div>

            <div class="chat-input-bar">
                <div class="filter-row">
                    <label for="sourceFilter">论文领域：</label>
                    <select id="sourceFilter">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="input-row">
                    <textarea id="chatInput" placeholder="输入问题，回车发送..."
                        rows="1" spellcheck="false"></textarea>
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i> 发送
                    </button>
                </div>
                <div class="quick-replies" id="quickReplies">
                    <span class="chip">Transformer 的核心贡献是什么？</span>
                    <span class="chip">BERT 和 GPT 的架构有什么区别？</span>
                    <span class="chip">Attention Is All You Need 论文的图表有哪些？</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentSessionId = null;
        let isResponseInProgress = false;
        let socket = null;
        let isDarkMode = true;

        const $messages = document.getElementById('chatMessages');
        const $input = document.getElementById('chatInput');
        const $sendBtn = document.getElementById('sendBtn');
        const $sourceFilter = document.getElementById('sourceFilter');
        const $historyList = document.getElementById('historyList');
        const $sessionInfo = document.getElementById('sessionInfo');
        const $themeToggle = document.getElementById('themeToggle');
        const API_BASE = '';

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            // 默认夜间模式：若从未设置过主题，默认开启
            const saved = localStorage.getItem('darkMode');
            isDarkMode = saved === null ? true : saved === 'true';
            updateTheme();
            await createNewSession();
            await loadSources();
            bindEvents();
        });

        function bindEvents() {
            $sendBtn.addEventListener('click', sendMessage);
            $input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            $input.addEventListener('input', () => {
                $input.style.height = 'auto';
                $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
            });
            document.getElementById('newSessionBtn').addEventListener('click', createNewSession);
            document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
            $themeToggle.addEventListener('click', toggleTheme);
            document.querySelectorAll('.quick-replies .chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    $input.value = chip.textContent;
                    $input.style.height = 'auto';
                    $input.style.height = $input.scrollHeight + 'px';
                    sendMessage();
                });
            });
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
            updateTheme();
        }
        function updateTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                $themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                $themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        async function createNewSession() {
            try {
                const res = await fetch(`${API_BASE}/api/create_session`, { method: 'POST' });
                const data = await res.json();
                currentSessionId = data.session_id;
                $sessionInfo.textContent = `会话 ${currentSessionId.slice(0, 8)}...`;
                clearChat();
                await loadHistory();
            } catch (e) { console.error('创建会话失败:', e); }
        }

        async function loadSources() {
            try {
                const res = await fetch(`${API_BASE}/api/sources`);
                const data = await res.json();
                $sourceFilter.innerHTML = '<option value="">全部</option>';
                data.sources.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s; opt.textContent = s;
                    $sourceFilter.appendChild(opt);
                });
            } catch (e) { console.error('加载领域失败:', e); }
        }

        async function loadHistory() {
            if (!currentSessionId) return;
            try {
                const res = await fetch(`${API_BASE}/api/history/${currentSessionId}`);
                const data = await res.json();
                $historyList.innerHTML = '';
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = `会话 ${currentSessionId.slice(0,8)}... (${data.history.length}轮)`;
                item.addEventListener('click', () => {
                    clearChat();
                    data.history.forEach(h => {
                        addMessage('user', h.question);
                        addMessage('system', h.answer);
                    });
                });
                $historyList.appendChild(item);
            } catch (e) { console.error('加载历史失败:', e); }
        }

        async function clearHistory() {
            if (!currentSessionId || !confirm('确定要清除所有历史记录吗？')) return;
            try {
                await fetch(`${API_BASE}/api/history/${currentSessionId}`, { method: 'DELETE' });
                $historyList.innerHTML = '';
                clearChat();
            } catch (e) { alert('清除失败'); }
        }

        function clearChat() {
            $messages.innerHTML = `
                <div class="message system">
                    <span class="label">论文阅读助手</span>
                    <div class="bubble">您好！我是论文阅读助手，可以帮您检索和分析学术论文。请问有什么想了解的？</div>
                </div>`;
        }

        function addMessage(type, content) {
            const el = document.createElement('div');
            el.className = `message ${type}`;
            el.innerHTML = `
                <span class="label">${type === 'user' ? '你' : '论文阅读助手'}</span>
                <div class="bubble">${marked.parse(content)}</div>`;
            $messages.appendChild(el);
            $messages.scrollTop = $messages.scrollHeight;
        }

        async function sendMessage() {
            const query = $input.value.trim();
            const filter = $sourceFilter.value;
            if (!query || isResponseInProgress) return;

            $input.value = '';
            $input.style.height = 'auto';
            addMessage('user', query);
            isResponseInProgress = true;

            // 输入指示器
            const typing = document.createElement('div');
            typing.className = 'message system';
            typing.innerHTML = '<span class="label">论文阅读助手</span><div class="typing bubble"><span></span><span></span><span></span></div>';
            $messages.appendChild(typing);
            $messages.scrollTop = $messages.scrollHeight;

            try {
                const res = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, source_filter: filter, session_id: currentSessionId })
                });
                const data = await res.json();
                typing.remove();

                if (data.is_streaming) {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'message system';
                    msgEl.innerHTML = '<span class="label">论文阅读助手</span><div class="bubble"></div>';
                    $messages.appendChild(msgEl);
                    const bubble = msgEl.querySelector('.bubble');
                    await streamResponse(query, filter, bubble);
                } else {
                    addMessage('system', data.answer);
                }
                await loadHistory();
            } catch (e) {
                typing.remove();
                addMessage('system', `发生错误: ${e.message}`);
            } finally {
                isResponseInProgress = false;
                $messages.scrollTop = $messages.scrollHeight;
            }
        }

        function renderSources(sources) {
            if (!sources || !sources.length) return '';
            const items = sources.map(s => {
                const badgeClass = s.type === 'figure' ? 'figure' : s.type === 'table' ? 'table' : '';
                const typeLabel = s.type === 'figure' ? '图表' : s.type === 'table' ? '表格' : '文本';
                return `<div class="source-item">
                    <span class="source-badge ${badgeClass}">${typeLabel}</span>
                    <span>${s.paper_id || s.source || '未知论文'}</span>
                </div>`;
            }).join('');
            return `<div class="sources-box">
                <div class="sources-title">📚 参考来源 (${sources.length}篇)</div>
                ${items}
            </div>`;
        }

        function streamResponse(query, filter, bubble) {
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();
            return new Promise((resolve, reject) => {
                const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${wsProtocol}//${location.host}${API_BASE}/api/stream`);
                let accumulated = '';
                let pendingSources = null;

                socket.onopen = () => socket.send(JSON.stringify({ query, source_filter: filter, session_id: currentSessionId }));
                socket.onmessage = e => {
                    const d = JSON.parse(e.data);
                    if (d.type === 'token') {
                        accumulated += d.token;
                        bubble.innerHTML = marked.parse(accumulated);
                        $messages.scrollTop = $messages.scrollHeight;
                    } else if (d.type === 'sources') {
                        pendingSources = d.sources;
                    } else if (d.type === 'end') {
                        if (pendingSources) {
                            bubble.innerHTML += renderSources(pendingSources);
                            $messages.scrollTop = $messages.scrollHeight;
                        }
                        socket.close(); resolve();
                    } else if (d.type === 'error') {
                        bubble.innerHTML += `<p style="color:red">[${d.error}]</p>`;
                        socket.close(); reject(new Error(d.error));
                    }
                };
                socket.onerror = () => { bubble.innerHTML += '<p style="color:red">[连接错误]</p>'; reject(); };
                socket.onclose = () => resolve();
            });
        }
    </script>
</body>
</html>
