# PaperRAG CI/CD Pipeline (GitHub Actions)
# 触发：push 到 main / 提交 Pull Request
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: 测试（CI = 持续集成，提交代码自动跑测试）
  # ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip   # 缓存依赖，加速后续构建

      # 依赖安装：复用 Dockerfile 同款精简依赖文件 requirements-docker.txt
      # （不用根目录 requirements.txt —— 它是 UTF-16 编码的 pip freeze 全量快照，
      #   含 CUDA 版 torch 等重依赖，CI 装不动且易超时）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # CPU 版 torch（单测够用，比 CUDA 版小约 10 倍、装得快）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r integrated_qa_system/requirements-docker.txt

      - name: 运行单元测试
        run: |
          cd integrated_qa_system
          pytest tests/ -v

  # ─────────────────────────────────────────────────────────────
  # Job 2: 构建 Docker 镜像（CD = 持续部署，测试通过才构建）
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test   # 依赖 test 通过才执行
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 构建 Docker 镜像
        run: docker build -t paperrag:${{ github.sha }} .

      # 冒烟测试：把镜像真正 docker run 起来，验证容器能启动 + /health 返回 200。
      # PAPERRAG_SMOKE_TEST=1 让 app 轻量启动（跳过模型加载与 MySQL/Redis/Milvus 连接），
      # 因为 CI 里没有模型文件、也没起基础设施——完整初始化会崩。
      - name: 冒烟测试（验证容器能启动 + 健康检查）
        run: |
          docker run -d --name smoke -e PAPERRAG_SMOKE_TEST=1 -p 8080:8080 paperrag:${{ github.sha }}
          # 轮询 /health，最多等 30 秒（容器启动 + uvicorn 就绪需要几秒）
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "✅ 冒烟测试通过：容器启动并响应 /health"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "❌ 冒烟测试失败：/health 超时无响应"
          docker logs smoke || true
          docker rm -f smoke
          exit 1

      # 生产环境可在此 push 到镜像仓库（Docker Hub / 私有 registry）
      # - name: 推送镜像
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker push paperrag:${{ github.sha }}
